<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3b2a"/><stop offset="1" stop-color="#3a1418"/></linearGradient>
    <clipPath id="board"><rect x="-78" y="-78" width="156" height="156" rx="14"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <!-- The pack's own emblem: the shape of the world it ships. A square world
       turned on its corner, one river across the diagonal, three lanes, and a
       base in each of the two opposite corners. It borrows no logo — this is
       the map this pack's own geometry.ts actually builds. -->
  <g transform="translate(128 128) rotate(45)">
    <rect x="-78" y="-78" width="156" height="156" rx="14" fill="#0e1a17" stroke="#6f8f7a" stroke-opacity=".5" stroke-width="4"/>
    <path d="M-90 0 H90" stroke="#3f7fa6" stroke-width="16" stroke-opacity=".85" clip-path="url(#board)"/>
    <g stroke="#c9b183" stroke-width="7" fill="none" stroke-linecap="round" stroke-opacity=".95">
      <path d="M-56 56 V-56 H56"/>
      <path d="M-56 56 H56 V-56"/>
      <path d="M-52 52 L52 -52"/>
    </g>
    <circle cx="-56" cy="56" r="20" fill="#4e9a4e"/>
    <circle cx="56" cy="-56" r="20" fill="#b8402f"/>
  </g>
</svg>
